<!doctype html>
<title>Admin (test)</title>
<h1>Admin status</h1>
<div id="out">loading...</div>
<script>
async function poll() {
  const res = await fetch("/admin/status");
  const data = await res.json();
  render(data);
}

function render(data) {
  const now = Date.now() / 1000;
  let html = "";

  for (const node of Object.keys(data.nodes).sort()) {
    html += "<h2>Node " + node + "</h2><table border=1>";
    html += "<tr><th>MAC</th><th>RSSI</th><th>age (s)</th></tr>";
    const readings = data.nodes[node];
    for (const mac of Object.keys(readings)) {
      const r = readings[mac];
      const age = (now - r.received_at).toFixed(1);
      html += "<tr><td>" + mac + "</td><td>" + r.rssi + "</td><td>" + age + "</td></tr>";
    }
    html += "</table>";
  }

  // Changed Teams table to add deregister button. KM
  html += "<h2>Teams</h2><table border=1>";
  html += "<tr><th>Name</th><th>MAC</th><th>Action</th></tr>";
  
  for (const t of data.teams) {
    html += "<tr><td>" + t.name + "</td><td>" + (t.mac || "(unresolved)") + "</td>";

    if (t.mac){
      html += "<td><button onclick=\"deregisterTeam('" + t.mac + "')\">Deregister</button></td>";
    } else {
      html += "<td></td>";
    }

    html += "</tr>"
  }

  html += "</table>";

  document.getElementById("out").innerHTML = html;
}

// Function called when button pressed to deregister team. KM
async function deregisterTeam(mac){
    if (!confirm("Deregister this team?")){
      return;
    }

    const res = await fetch("/admin/deregister", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({mac: mac})
    });

  if (!res.ok){
    alert("Unable to deregister team.");
    return;
  }

  await poll();

}
  

poll();
setInterval(poll, 1500);
</script>
